
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>multi_jarvis · 集群指挥台</title>
<style>
/* ==========================================================================
   multi_jarvis 原型 · 设计令牌
   基调：近黑底 + 细边框 + 低饱和状态色；数字等宽；避免大圆角与渐变堆叠
   ========================================================================== */
:root{
  --bg:#0b0d10;
  --panel:#0e1116;
  --panel-2:#11151b;
  --raise:#151a21;
  --line:#1c2229;
  --line-2:#262e38;
  --line-hi:#39434f;

  --tx:#dfe5ec;
  --tx-2:#98a3b0;
  --tx-3:#5f6a77;
  --tx-4:#3f4954;

  /* 状态色：运行 = 青绿，待验收 = 琥珀，异常/拦截 = 红，信息 = 青 */
  --run:#3ee0a4;
  --run-soft:rgba(62,224,164,.12);
  --wait:#f0b45a;
  --wait-soft:rgba(240,180,90,.12);
  --bad:#ff5f5f;
  --bad-soft:rgba(255,95,95,.10);
  --sig:#63c9dd;
  --sig-soft:rgba(99,201,221,.10);

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r:2px;
  --ease:cubic-bezier(.2,.7,.3,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
::selection{background:rgba(99,201,221,.22)}
:focus-visible{outline:1px solid var(--sig);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#232b34;border:2px solid var(--bg);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2e3843}
::-webkit-scrollbar-track{background:transparent}

/* 排版工具 */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.micro{font-size:10px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3)}
.dim{color:var(--tx-3)}
.muted{color:var(--tx-2)}
.up{color:var(--run)}
.down{color:var(--bad)}
.nowrap{white-space:nowrap}
.hair{height:1px;background:var(--line);border:0;margin:0}

/* ==========================================================================
   外壳
   ========================================================================== */
.app{
  height:100vh;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 520px at 78% -16%, rgba(62,224,164,.05), transparent 62%),
    radial-gradient(900px 520px at -10% 110%, rgba(99,201,221,.045), transparent 60%),
    var(--bg);
}
.topbar{
  flex:none;height:54px;display:flex;align-items:stretch;gap:16px;
  padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(11,13,16,.82);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.mark{
  width:28px;height:28px;display:grid;place-items:center;
  border:1px solid var(--line-hi);border-radius:var(--r);
  font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--run);
  box-shadow:inset 0 0 18px rgba(62,224,164,.14), 0 0 0 1px rgba(62,224,164,.06);
  position:relative;
}
.mark::after{content:"";position:absolute;right:-1px;top:-1px;width:5px;height:5px;border-top:1px solid var(--run);border-right:1px solid var(--run)}
.brand-name{font-size:13.5px;font-weight:600;letter-spacing:.02em;line-height:1.25}
.brand-sub{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-3);line-height:1.4}
.topbar-sep{width:1px;background:var(--line);margin:14px 0;flex:none}
.cluster-id{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx-2);flex:none}
.cluster-id .mono{font-size:10.5px;color:var(--tx-3)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.tb-metric{display:flex;flex-direction:column;gap:1px;line-height:1.25}
.tb-metric .mono{font-size:11.5px;color:var(--tx-2)}
.clock{font-size:11.5px;color:var(--tx-3)}
.user{
  width:28px;height:28px;border:1px solid var(--line-2);border-radius:50%;
  font:600 10px/1 var(--mono);letter-spacing:.03em;color:var(--tx-2);
  display:grid;place-items:center;transition:border-color .18s var(--ease),color .18s;
}
.user:hover{border-color:var(--line-hi);color:var(--tx)}

.shell{flex:1;display:flex;min-height:0}

/* 左侧导航 */
.rail{
  flex:none;width:206px;display:flex;flex-direction:column;
  padding:10px 10px 12px;border-right:1px solid var(--line);
  background:linear-gradient(180deg, rgba(255,255,255,.014), transparent 42%);
}
.rail-group{
  padding:14px 10px 6px;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx-4);font-weight:600;
}
.nav-item{
  position:relative;display:flex;align-items:center;gap:10px;height:33px;padding:0 10px;
  border-radius:var(--r);color:var(--tx-2);font-size:12.5px;text-align:left;
  transition:background .16s var(--ease),color .16s;
}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--tx)}
.nav-item.is-active{color:var(--tx);background:linear-gradient(90deg, rgba(62,224,164,.075), rgba(62,224,164,.008))}
.nav-item.is-active::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--run);
  box-shadow:0 0 8px rgba(62,224,164,.7);
}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.8}
.nav-item.is-active svg{opacity:1;color:var(--run)}
.nav-count{
  margin-left:auto;font:10px/1 var(--mono);color:var(--tx-4);
  padding:3px 5px;border:1px solid var(--line);border-radius:2px;
}
.nav-item.is-active .nav-count{color:var(--run);border-color:rgba(62,224,164,.28);background:rgba(62,224,164,.06)}
.rail-create{
  margin-top:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;
  border:1px dashed var(--line-2);border-radius:var(--r);color:var(--tx-2);
  font-size:12.5px;transition:all .18s var(--ease);
}
.rail-create:hover{border-color:rgba(62,224,164,.5);color:var(--run);background:var(--run-soft)}
.rail-create svg{width:13px;height:13px}
.rail-foot{margin-top:12px;padding:10px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rail-status{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx-3)}
.rail-foot .mono{font-size:9.5px;color:var(--tx-4);letter-spacing:.06em}

/* 主区域 */
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 48px;scroll-behavior:smooth}
.view{max-width:1580px;margin:0 auto;animation:rise .3s var(--ease) both}
.view-head{display:flex;align-items:flex-start;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.vh-left{min-width:0;flex:1}
.vh-title{font-size:19px;font-weight:600;letter-spacing:.01em;line-height:1.3;display:flex;align-items:center;gap:10px}
.vh-sub{margin-top:5px;font-size:11.5px;color:var(--tx-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vh-sub .mono{font-size:10.5px;color:var(--tx-4)}
.vh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx-3);margin-bottom:8px}
.crumb button{color:var(--tx-3);font-size:10.5px}
.crumb button:hover{color:var(--sig)}
.crumb .mono{color:var(--tx-4)}

/* 按钮 */
.btn{
  height:31px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line-2);border-radius:var(--r);background:#12171d;
  color:var(--tx);font-size:12px;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s,color .16s;
}
.btn svg{width:13px;height:13px;flex:none}
.btn:hover{border-color:var(--line-hi);background:#171d24}
.btn:active{transform:translateY(.5px)}
.btn.primary{
  background:rgba(62,224,164,.10);border-color:rgba(62,224,164,.4);color:#9df3d3;
}
.btn.primary:hover{background:rgba(62,224,164,.17);border-color:rgba(62,224,164,.65);box-shadow:0 0 18px rgba(62,224,164,.1)}
.btn.danger{background:var(--bad-soft);border-color:rgba(255,95,95,.38);color:#ffb3b3}
.btn.danger:hover{background:rgba(255,95,95,.16);border-color:rgba(255,95,95,.6)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.btn.small{height:24px;padding:0 9px;font-size:11px;gap:5px}
.btn.small svg{width:11px;height:11px}
.btn:disabled,.btn[disabled]{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
.btn:disabled:hover{border-color:var(--line-2);background:#12171d}
.btn.primary:disabled:hover{background:rgba(62,224,164,.10);border-color:rgba(62,224,164,.4)}

/* 状态灯 / 标签 */
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none;background:var(--tx-3)}
.dot.run{background:var(--run);box-shadow:0 0 0 3px rgba(62,224,164,.12),0 0 9px rgba(62,224,164,.5)}
.dot.wait{background:var(--wait);box-shadow:0 0 0 3px rgba(240,180,90,.12),0 0 9px rgba(240,180,90,.4)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(255,95,95,.12),0 0 9px rgba(255,95,95,.5)}
.dot.idle{background:#4b5561;box-shadow:0 0 0 3px rgba(75,85,97,.14)}
.dot.live{animation:pulse 2.2s var(--ease) infinite}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 6px;border:1px solid var(--line-2);
  border-radius:2px;font:9.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx-3);
  white-space:nowrap;
}
.tag.req{color:#8fd8e6;border-color:rgba(99,201,221,.32);background:var(--sig-soft)}
.tag.rep{color:#8ff0cc;border-color:rgba(62,224,164,.3);background:var(--run-soft)}
.tag.wait{color:#f3c47f;border-color:rgba(240,180,90,.3);background:var(--wait-soft)}
.tag.bad{color:#ff9e9e;border-color:rgba(255,95,95,.32);background:var(--bad-soft)}
.tag.sys{color:var(--tx-2);border-color:var(--line-2);background:rgba(255,255,255,.025)}
.tag.run{color:#8ff0cc;border-color:rgba(62,224,164,.28);background:var(--run-soft)}

/* ==========================================================================
   通用面板
   ========================================================================== */
.panel{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));min-width:0;display:flex;flex-direction:column}
.panel-head{
  flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--line);
}
.panel-title{font-size:12px;font-weight:600;letter-spacing:.04em}
.panel-head .micro{margin-left:2px}
.panel-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-body{padding:14px}
.panel-body.flush{padding:0}
.panel-link{font-size:10.5px;color:var(--tx-3);display:inline-flex;align-items:center;gap:3px}
.panel-link:hover{color:var(--sig)}
.panel-link svg{width:11px;height:11px}

/* ==========================================================================
   总览
   ========================================================================== */
.metrics{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-bottom:16px;
}
.metric{background:var(--panel);padding:12px 15px 11px;min-width:0;position:relative}
.metric::before{content:"";position:absolute;left:0;top:0;width:0;height:0;border-left:6px solid var(--line);border-bottom:6px solid transparent;opacity:.6}
.m-label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-3);font-weight:600;margin-bottom:6px}
.m-value{font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.15;letter-spacing:-.02em}
.m-value .unit{font-size:11px;color:var(--tx-3);margin-left:4px;letter-spacing:0}
.m-foot{margin-top:5px;font-size:10px;color:var(--tx-4);display:flex;align-items:center;gap:6px}
.m-foot .mono{font-size:9.5px}
.m-value.wait{color:var(--wait)}
.m-value.bad{color:var(--bad)}
.m-value.sig{color:var(--sig)}

.ov-grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);gap:16px;align-items:stretch}
.graph-panel{overflow:hidden;position:relative}
.graph-panel .panel-head{background:rgba(11,14,18,.4)}
.graph-wrap{position:relative;flex:1;min-height:430px;padding:2px 4px 0;overflow:hidden}
.graph-wrap::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(120,140,160,.13) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:radial-gradient(ellipse at 50% 46%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 46%, #000 30%, transparent 78%);
  pointer-events:none;
}
.graph-wrap::after{
  content:"";position:absolute;inset:12px;pointer-events:none;
  border:1px solid rgba(255,255,255,.035);
}
.graph-svg{display:block;width:100%;height:auto;position:relative;z-index:1}
.graph-foot{
  flex:none;display:flex;align-items:center;gap:16px;padding:9px 14px;
  border-top:1px solid var(--line);font-size:10px;color:var(--tx-3);flex-wrap:wrap;
}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-item .dot{width:5px;height:5px;box-shadow:none}
.legend-line{width:16px;border-top:1px dashed var(--line-hi);height:1px}
.legend-line.solid{border-top-style:solid;border-color:var(--sig)}
.graph-foot .mono{margin-left:auto;font-size:9.5px;color:var(--tx-4)}

.ov-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.trace-panel{flex:1;min-height:0}
.trace-list{display:flex;flex-direction:column}
.trace-row{
  display:grid;grid-template-columns:44px 7px minmax(0,1fr);gap:9px;align-items:start;
  padding:9px 13px;border-bottom:1px solid var(--line);cursor:default;
  transition:background .16s var(--ease);position:relative;
}
.trace-row:last-child{border-bottom:0}
.trace-row:hover{background:rgba(255,255,255,.022)}
.trace-row.is-blocked{background:linear-gradient(90deg,rgba(255,95,95,.055),transparent)}
.trace-row .dot{margin-top:5px}
.t-time{font-family:var(--mono);font-size:9.5px;color:var(--tx-4);padding-top:1px;letter-spacing:-.02em}
.t-line{font-size:11.5px;color:var(--tx-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.4}
.t-line b{color:var(--tx);font:500 10px/1 var(--mono);letter-spacing:.05em}
.t-line .kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;padding:1px 4px;border-radius:1px}
.kind.req{color:#8fd8e6;background:rgba(99,201,221,.1)}
.kind.rep{color:#8ff0cc;background:rgba(62,224,164,.1)}
.kind.sys{color:#ff9e9e;background:rgba(255,95,95,.1)}
.t-body{margin-top:2px;font-size:10.5px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.queue-panel{flex:none}
.queue-list{display:flex;flex-direction:column}
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
.queue-item:last-child{border-bottom:0}
.qi-main{min-width:0;flex:1}
.qi-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi-meta{margin-top:2px;font-size:9.5px;color:var(--tx-4);font-family:var(--mono);letter-spacing:.01em}
.block-item{padding:10px 13px;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,rgba(255,95,95,.05),transparent)}
.block-item .b-txt{min-width:0;flex:1}
.block-item .b-title{font-size:11.5px;color:#ffb3b3}
.block-item .b-meta{font-size:9.5px;color:var(--tx-4);margin-top:2px;font-family:var(--mono)}
.empty-note{padding:18px 14px;color:var(--tx-4);font-size:11px;text-align:center}

/* ==========================================================================
   Agent 创建向导
   ========================================================================== */
.wizard{
  border:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:calc(100vh - 170px);
}
.steps{display:flex;border-bottom:1px solid var(--line);flex:none;background:rgba(255,255,255,.008)}
.step{
  flex:1;display:flex;align-items:center;gap:11px;padding:0 20px;height:63px;position:relative;color:var(--tx-3);
  min-width:0;
}
.step + .step{border-left:1px solid var(--line)}
.step-num{
  width:23px;height:23px;flex:none;display:grid;place-items:center;border:1px solid var(--line-2);
  border-radius:50%;font:10px/1 var(--mono);color:var(--tx-3);transition:all .2s var(--ease);
}
.step-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-desc{font-size:9.5px;color:var(--tx-4);margin-top:1px;letter-spacing:.02em}
.step.is-active{color:var(--tx);background:linear-gradient(180deg,rgba(62,224,164,.05),transparent)}
.step.is-active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--run);box-shadow:0 0 10px rgba(62,224,164,.35)}
.step.is-active .step-num{border-color:rgba(62,224,164,.55);color:var(--run);background:rgba(62,224,164,.07);box-shadow:0 0 14px rgba(62,224,164,.1)}
.step.is-done .step-num{color:var(--tx-2);border-color:var(--line-hi)}
.step.is-done .step-num svg{width:11px;height:11px}
.wizard-body{flex:1;padding:24px 26px;overflow:auto}
.wizard-foot{
  flex:none;display:flex;align-items:center;gap:10px;padding:14px 22px;
  border-top:1px solid var(--line);background:rgba(255,255,255,.008);
}
.wizard-foot .wf-hint{font-size:10.5px;color:var(--tx-4);margin-right:auto}
.wizard-foot .wf-hint .mono{color:var(--tx-3)}

.step-intro{margin-bottom:20px;max-width:720px}
.step-intro h3{font-size:14px;font-weight:600;margin-bottom:4px}
.step-intro p{font-size:11.5px;color:var(--tx-3);line-height:1.65}
.tpl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{
  position:relative;text-align:left;border:1px solid var(--line);background:#0f1319;padding:14px;
  transition:border-color .18s var(--ease),background .18s,transform .18s;
}
.tpl:hover{border-color:var(--line-2);background:#11161d;transform:translateY(-1px)}
.tpl.is-selected{border-color:rgba(62,224,164,.5);background:linear-gradient(160deg,rgba(62,224,164,.07),rgba(62,224,164,.015));box-shadow:inset 0 0 0 1px rgba(62,224,164,.08)}
.tpl-check{position:absolute;top:10px;right:10px;color:var(--run);opacity:0;transition:opacity .16s}
.tpl.is-selected .tpl-check{opacity:1}
.tpl-check svg{width:13px;height:13px}
.tpl-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.tpl-code{
  width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--line-2);
  font:600 9.5px/1 var(--mono);letter-spacing:.02em;color:var(--tx-2);background:#0b0f14;
}
.tpl.is-selected .tpl-code{border-color:rgba(62,224,164,.45);color:var(--run)}
.tpl-role{font-size:12.5px;font-weight:600;line-height:1.2}
.tpl-code-name{font:9.5px/1 var(--mono);color:var(--tx-4);letter-spacing:.08em;margin-top:3px}
.tpl-desc{font-size:10.5px;color:var(--tx-3);line-height:1.6;min-height:34px}
.tpl-meta{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--tx-4);font-family:var(--mono)}
.tpl-meta .sep{width:1px;height:9px;background:var(--line)}

.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 20px;max-width:900px}
.form-grid .span2{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600;display:flex;align-items:center;gap:7px}
.field > label .opt{letter-spacing:.02em;text-transform:none;color:var(--tx-4);font-weight:400;font-family:var(--mono);font-size:9px}
.field > label .req{color:var(--wait);font-family:var(--mono)}
.input,.textarea,.select{
  width:100%;background:#0b0f14;border:1px solid var(--line-2);border-radius:var(--r);
  padding:8px 10px;font-size:12px;color:var(--tx);transition:border-color .16s,box-shadow .16s;
}
.input{height:33px;padding:0 10px}
.textarea{min-height:76px;resize:vertical;line-height:1.65;font-family:var(--sans)}
.input:hover,.textarea:hover,.select:hover{border-color:#303a45}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:rgba(99,201,221,.55);box-shadow:0 0 0 3px rgba(99,201,221,.07)}
.input::placeholder,.textarea::placeholder{color:var(--tx-4)}
.select{height:33px;appearance:none;padding-right:28px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#5f6a77 50%),linear-gradient(135deg,#5f6a77 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.hint{font-size:9.5px;color:var(--tx-4);line-height:1.5;display:flex;align-items:center;gap:5px}
.hint .mono{color:var(--tx-3)}
.rule-box{
  border:1px solid var(--line);background:#0e1218;padding:12px 14px;display:flex;flex-direction:column;gap:8px;
}
.rule-box .rb-title{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600;display:flex;align-items:center;gap:7px}
.rule-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.rule-item{display:flex;align-items:flex-start;gap:7px;font-size:10.5px;color:var(--tx-2);line-height:1.5}
.rule-item svg{width:11px;height:11px;flex:none;margin-top:2px;color:var(--tx-4)}
.rule-item b{color:var(--tx);font-weight:500}

.perm-list{border:1px solid var(--line);background:#0e1218}
.perm{
  width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;transition:background .16s;
}
.perm:last-child{border-bottom:0}
.perm:hover{background:rgba(255,255,255,.022)}
.perm-ic{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);color:var(--tx-3)}
.perm-ic svg{width:12px;height:12px}
.perm.is-on .perm-ic{color:var(--run);border-color:rgba(62,224,164,.28);background:var(--run-soft)}
.perm-txt{min-width:0}
.perm-name{font:10.5px/1.4 var(--mono);color:var(--tx-2)}
.perm.is-on .perm-name{color:var(--tx)}
.perm-desc{font-size:9.5px;color:var(--tx-4);margin-top:1px}
.switch{
  width:30px;height:17px;border:1px solid var(--line-2);border-radius:9px;background:#0b0f14;
  position:relative;transition:background .18s,border-color .18s;flex:none;
}
.switch .knob{
  position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#4b5561;
  transition:transform .18s var(--ease),background .18s;
}
.perm.is-on .switch{background:rgba(62,224,164,.14);border-color:rgba(62,224,164,.5)}
.perm.is-on .switch .knob{transform:translateX(13px);background:var(--run);box-shadow:0 0 8px rgba(62,224,164,.6)}

/* 向导第 3 步：左配置 / 右实时卡片预览 */
.step3-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.85fr);gap:24px;align-items:start}
.preview-label{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600;margin-bottom:8px}
.preview-label .live{display:flex;align-items:center;gap:5px;color:var(--run);letter-spacing:.06em;font-family:var(--mono);font-size:9px}
.agent-card-preview{
  border:1px solid rgba(62,224,164,.22);background:
    radial-gradient(420px 180px at 80% -20%, rgba(62,224,164,.08), transparent 70%),
    #0f1419;
  position:relative;overflow:hidden;
}
.agent-card-preview::before{
  content:"";position:absolute;left:0;top:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(62,224,164,.5),transparent);
}
.pc-head{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.pc-avatar{
  width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid rgba(62,224,164,.35);
  background:#0a1114;font:600 13px/1 var(--mono);color:var(--run);position:relative;
  box-shadow:inset 0 0 20px rgba(62,224,164,.08);
}
.pc-avatar .dot{position:absolute;right:-3px;bottom:-3px;border:2px solid #0f1419;width:9px;height:9px}
.pc-id{min-width:0;flex:1}
.pc-name{font:600 14px/1.2 var(--mono);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.pc-role{font-size:10.5px;color:var(--tx-3);margin-top:4px;display:flex;align-items:center;gap:6px}
.pc-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.pc-block .pc-k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4);margin-bottom:5px}
.pc-duty{font-size:11.5px;color:var(--tx-2);line-height:1.7;border-left:1px solid var(--line-2);padding-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font:9.5px/1.4 var(--mono);padding:2px 6px;border:1px solid var(--line-2);
  color:var(--tx-2);background:#0b0f14;letter-spacing:.02em;
}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-top:11px;border-top:1px solid var(--line)}
.pc-meta .pc-k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);margin-bottom:3px}
.pc-meta .v{font:11px/1.4 var(--mono);color:var(--tx-2);display:flex;align-items:center;gap:5px}
.pc-foot{padding:9px 16px;border-top:1px solid var(--line);font-size:9.5px;color:var(--tx-4);display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.12)}
.pc-foot svg{width:11px;height:11px;flex:none}

/* ==========================================================================
   Agent 详情
   ========================================================================== */
.identity{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 20px;align-items:center;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel));
  padding:16px 18px;margin-bottom:16px;position:relative;
}
.identity::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(62,224,164,.6),transparent)}
.id-avatar{
  width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--line-hi);
  background:#0a0f13;font:600 15px/1 var(--mono);color:var(--run);position:relative;
}
.id-avatar .dot{position:absolute;right:-3px;bottom:-3px;border:2px solid #0e1116;width:10px;height:10px}
.id-name{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.id-name h2{font:600 16px/1.2 var(--mono);letter-spacing:.06em}
.id-tags{display:flex;gap:6px;flex-wrap:wrap}
.id-duty{margin-top:7px;font-size:11.5px;color:var(--tx-3);max-width:720px;line-height:1.65}
.id-stats{display:flex;gap:0;align-items:stretch;border-left:1px solid var(--line)}
.stat{padding:2px 16px;display:flex;flex-direction:column;gap:3px;min-width:92px}
.stat + .stat{border-left:1px solid var(--line)}
.stat .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4)}
.stat .v{font:12px/1.3 var(--mono);color:var(--tx-2)}
.stat .v.run{color:var(--run)}

.agent-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.prose{font-size:11.5px;line-height:1.8;color:var(--tx-2)}
.prose strong{color:var(--tx);font-weight:500}
.section-t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.kv-row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:11px}
.kv-row .k{color:var(--tx-3);font-size:10.5px}
.kv-row .v{color:var(--tx-2);font-family:var(--mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv-row:last-child{border-bottom:1px solid var(--line)}
.tool-list{display:flex;flex-wrap:wrap;gap:6px}
.tool{
  display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line-2);
  background:#0b0f14;font:10px/1.3 var(--mono);color:var(--tx-2);
}
.tool svg{width:10px;height:10px;color:var(--tx-3)}
.budget-bar{height:3px;background:#1a2028;position:relative;overflow:hidden;margin:6px 0 4px}
.budget-bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(62,224,164,.5),var(--run))}
.budget-bar .fill.wait{background:linear-gradient(90deg,rgba(240,180,90,.5),var(--wait))}
.budget-line{display:flex;justify-content:space-between;font:9.5px/1.4 var(--mono);color:var(--tx-4)}

.task-mini{display:flex;flex-direction:column;gap:9px}
.tm-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500}
.tm-title .mono{font-size:9.5px;color:var(--tx-4)}
.tm-goal{font-size:11px;color:var(--tx-3);line-height:1.65}
.tm-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.tm-meta .cell{padding-right:10px}
.tm-meta .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);margin-bottom:3px}
.tm-meta .v{font:11px/1.3 var(--mono);color:var(--tx-2)}

/* 收件箱 */
.inbox{display:flex;flex-direction:column}
.msg{border-bottom:1px solid var(--line);padding:13px 14px;position:relative}
.msg:last-child{border-bottom:0}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:transparent}
.msg.is-open::before{background:var(--wait);box-shadow:0 0 8px rgba(240,180,90,.4)}
.msg.is-closed::before{background:var(--run);opacity:.45}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.msg-from{font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--tx)}
.msg-head .arrow{color:var(--tx-4);font-size:10px}
.msg-to{font:10px/1 var(--mono);color:var(--tx-3)}
.msg-time{margin-left:auto;font:9.5px/1 var(--mono);color:var(--tx-4)}
.msg-body{margin-top:8px;font-size:11.5px;line-height:1.7;color:var(--tx-2)}
.msg-rule{
  margin-top:6px;display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--tx-4);
  font-family:var(--mono);letter-spacing:.01em;
}
.msg-rule .icon-lock{color:var(--wait)}
.msg-rule svg{width:10px;height:10px}
.msg.is-closed .msg-rule{color:var(--tx-4)}
.reply-box{margin-top:10px;border:1px solid var(--line-2);background:#0b0f14}
.reply-box textarea{
  width:100%;height:58px;resize:vertical;border:0;background:transparent;padding:9px 10px;
  font-size:11.5px;line-height:1.6;color:var(--tx);outline:none;
}
.reply-box textarea::placeholder{color:var(--tx-4)}
.reply-foot{display:flex;align-items:center;gap:8px;padding:7px 9px;border-top:1px solid var(--line);flex-wrap:wrap}
.reply-foot .rf-hint{font-size:9.5px;color:var(--tx-4);margin-right:auto;display:flex;align-items:center;gap:5px}
.reply-foot .rf-hint svg{width:10px;height:10px}
.reply-box.is-disabled{opacity:.55}
.reply-box.is-disabled textarea{cursor:not-allowed;color:var(--tx-3)}
.reply-disabled-note{
  margin-top:8px;display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border:1px dashed var(--line-2);
  background:rgba(255,255,255,.018);font-size:10px;color:var(--tx-4);line-height:1.6;
}
.reply-disabled-note svg{width:11px;height:11px;flex:none;margin-top:1px;color:var(--tx-3)}
.reply-bubble{
  margin-top:9px;border-left:1px solid rgba(62,224,164,.35);padding:2px 0 2px 10px;
  font-size:11.5px;color:var(--tx-2);line-height:1.7;
}
.reply-bubble .rb-head{font:9px/1.4 var(--mono);letter-spacing:.08em;color:var(--run);margin-bottom:3px}
.msg.closed{background:rgba(255,255,255,.012)}
.msg-flag{font:8.5px/1.4 var(--mono);letter-spacing:.06em;color:var(--tx-4);border:1px solid var(--line);padding:1px 4px}

/* ==========================================================================
   任务看板
   ========================================================================== */
.board-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filter{
  height:25px;padding:0 10px;border:1px solid var(--line-2);border-radius:2px;
  font-size:10.5px;color:var(--tx-3);background:transparent;display:inline-flex;align-items:center;gap:6px;
  transition:all .16s var(--ease);
}
.filter:hover{color:var(--tx-2);border-color:var(--line-hi)}
.filter.is-on{color:var(--tx);border-color:rgba(99,201,221,.35);background:var(--sig-soft)}
.filter .c{font-family:var(--mono);font-size:9px;color:var(--tx-4)}
.filter.is-on .c{color:var(--sig)}
.board-tools .bt-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{border:1px solid var(--line);background:rgba(14,17,22,.55);min-width:0;display:flex;flex-direction:column}
.col-head{
  display:flex;align-items:center;gap:8px;padding:0 11px;height:37px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.012);position:relative;
}
.col-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line-2)}
.col[data-col="todo"] .col-head::before{background:var(--line-hi)}
.col[data-col="running"] .col-head::before{background:var(--run);box-shadow:0 0 8px rgba(62,224,164,.5)}
.col[data-col="review"] .col-head::before{background:var(--wait);box-shadow:0 0 8px rgba(240,180,90,.45)}
.col[data-col="done"] .col-head::before{background:#3b4a44}
.col-title{font-size:11px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;gap:7px}
.col-count{font:9.5px/1 var(--mono);color:var(--tx-4);padding:2px 5px;border:1px solid var(--line);border-radius:2px}
.col-hint{margin-left:auto;font-size:9px;color:var(--tx-4);font-family:var(--mono)}
.col-body{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col-body.drag-over{background:rgba(99,201,221,.04);outline:1px dashed rgba(99,201,221,.25);outline-offset:-4px}
.task-card{
  border:1px solid var(--line);background:#10151b;padding:11px;position:relative;
  transition:border-color .16s var(--ease),transform .16s,box-shadow .16s;
}
.task-card:hover{border-color:var(--line-hi);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.task-card.is-new{animation:cardIn .35s var(--ease)}
.task-card.is-queued{opacity:.82;border-style:dashed}
.tc-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.tc-id{font:9px/1 var(--mono);color:var(--tx-4);letter-spacing:.06em}
.tc-top .spacer{margin-left:auto}
.tc-title{font-size:12px;font-weight:600;line-height:1.45;letter-spacing:.01em}
.tc-goal{margin-top:5px;font-size:10.5px;color:var(--tx-3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
.tc-meta .k{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4)}
.tc-meta .v{font:10px/1.3 var(--mono);color:var(--tx-2)}
.tc-meta .v.wait{color:var(--wait)}
.tc-progress{margin-top:9px}
.tc-progress .bar{height:2px;background:#1a2028;position:relative;overflow:hidden}
.tc-progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--run);opacity:.75}
.tc-progress .lbl{display:flex;justify-content:space-between;font:9px/1.4 var(--mono);color:var(--tx-4);margin-top:4px}
.tc-actions{margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tc-assignee{display:flex;align-items:center;gap:5px;font:9.5px/1.4 var(--mono);color:var(--tx-2);margin-left:auto}
.tc-assignee .dot{width:5px;height:5px;box-shadow:none}
.tc-note{font-size:9.5px;color:var(--bad);margin-top:6px;display:flex;gap:5px;align-items:flex-start;line-height:1.5}
.tc-note svg{width:10px;height:10px;flex:none;margin-top:1px}
.col-empty{padding:14px 8px;text-align:center;font-size:10px;color:var(--tx-4);border:1px dashed var(--line);line-height:1.7}

/* ==========================================================================
   验收
   ========================================================================== */
.review-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.85fr);gap:16px;align-items:start}
.doc-panel{min-width:0}
.doc-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.01)}
.doc-toolbar .dt-name{font:10.5px/1.4 var(--mono);color:var(--tx-2);display:flex;align-items:center;gap:7px}
.doc-toolbar .dt-name svg{width:12px;height:12px;color:var(--tx-3)}
.doc-toolbar .dt-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.doc-scroll{padding:0}
.doc{
  padding:30px 34px 34px;font-size:12px;line-height:1.85;color:#c6cfd8;max-height:calc(100vh - 300px);overflow:auto;
  background:linear-gradient(180deg,rgba(255,255,255,.006),transparent 120px);
}
.doc-head-h{margin-bottom:4px;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-4)}
.doc h1{font-size:20px;font-weight:600;letter-spacing:.01em;color:var(--tx);line-height:1.35;margin-bottom:10px}
.doc-meta{display:flex;gap:14px;flex-wrap:wrap;font:9.5px/1.5 var(--mono);color:var(--tx-4);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.doc-meta b{color:var(--tx-3);font-weight:400}
.doc-summary{border:1px solid var(--line);background:#0d1218;padding:12px 14px;margin:0 0 20px;font-size:11px;color:var(--tx-2);line-height:1.8}
.doc-summary .ds-t{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);margin-bottom:5px}
.doc h2{font-size:13px;font-weight:600;color:var(--tx);margin:22px 0 9px;padding-left:9px;border-left:2px solid rgba(62,224,164,.4);line-height:1.5}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 12px;padding-left:0;display:flex;flex-direction:column;gap:5px}
.doc ul li{position:relative;padding-left:14px;font-size:11.5px}
.doc ul li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:1px;background:var(--tx-4)}
.doc table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:10.5px}
.doc th{text-align:left;font:9px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx-4);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line-2);background:rgba(255,255,255,.015)}
.doc td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--tx-2);vertical-align:top}
.doc td code,.doc p code{font-family:var(--mono);font-size:10px;color:#a9dbe6;background:rgba(99,201,221,.07);padding:1px 4px;border:1px solid rgba(99,201,221,.1)}
.doc pre{
  margin:0 0 16px;padding:12px 14px;background:#080b0e;border:1px solid var(--line);overflow:auto;
  font:10px/1.75 var(--mono);color:var(--tx-3);
}
.doc pre .c{color:var(--tx-4)}
.doc pre .g{color:#8ff0cc}
.doc pre .y{color:#f3c47f}
.doc .callout{
  margin:0 0 16px;padding:10px 13px;border-left:2px solid rgba(255,95,95,.55);
  background:rgba(255,95,95,.045);font-size:10.5px;line-height:1.8;color:var(--tx-2);
}
.doc .callout b{color:#ffb3b3;font-weight:500}
.doc-foot{margin-top:22px;padding-top:12px;border-top:1px dashed var(--line-2);font:9px/1.7 var(--mono);color:var(--tx-4)}
.attach-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.01)}
.attach{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line-2);background:#0b0f14;font:9.5px/1.3 var(--mono);color:var(--tx-3)}
.attach svg{width:10px;height:10px}
.attach:hover{border-color:var(--line-hi);color:var(--tx-2)}

.review-side{display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:0}
.checklist{display:flex;flex-direction:column;gap:0;padding:0}
.check{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;
  padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;
  transition:background .16s;
}
.check:last-child{border-bottom:0}
.check:hover{background:rgba(255,255,255,.02)}
.check-box{
  width:15px;height:15px;flex:none;border:1px solid var(--line-hi);margin-top:1px;
  display:grid;place-items:center;background:#0b0f14;transition:all .16s var(--ease);
}
.check-box svg{width:10px;height:10px;color:#08251b;opacity:0;transition:opacity .14s}
.check.is-checked .check-box{background:var(--run);border-color:var(--run);box-shadow:0 0 10px rgba(62,224,164,.28)}
.check.is-checked .check-box svg{opacity:1}
.check-txt{font-size:11px;line-height:1.6;color:var(--tx-2)}
.check.is-checked .check-txt{color:var(--tx-3)}
.check-note{font-size:9px;color:var(--tx-4);font-family:var(--mono);margin-top:3px;letter-spacing:.02em}
.check-progress{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.014)}
.check-progress .cp-bar{flex:1;height:2px;background:#1a2028;position:relative;overflow:hidden}
.check-progress .cp-fill{position:absolute;left:0;top:0;bottom:0;background:var(--run);transition:width .25s var(--ease)}
.check-progress .cp-txt{font:9.5px/1.2 var(--mono);color:var(--tx-3);white-space:nowrap}
.review-actions{padding:13px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line)}
.review-actions .ra-row{display:flex;gap:8px}
.review-actions .ra-row .btn{flex:1;justify-content:center}
.reason{width:100%;height:64px;resize:vertical;background:#0b0f14;border:1px solid var(--line-2);color:var(--tx);
  padding:8px 10px;font-size:11px;line-height:1.6;border-radius:2px;outline:none;transition:border-color .16s}
.reason:focus{border-color:rgba(240,180,90,.5);box-shadow:0 0 0 3px rgba(240,180,90,.06)}
.reason::placeholder{color:var(--tx-4)}
.ra-hint{font-size:9px;color:var(--tx-4);line-height:1.5;display:flex;align-items:center;gap:5px}
.ra-hint svg{width:10px;height:10px;flex:none}
.ra-hint.warn{color:var(--wait)}
.result{padding:20px 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.result-ic{
  width:38px;height:38px;display:grid;place-items:center;border:1px solid;
}
.result.pass .result-ic{border-color:rgba(62,224,164,.4);background:var(--run-soft);color:var(--run);box-shadow:0 0 24px rgba(62,224,164,.1)}
.result.reject .result-ic{border-color:rgba(255,95,95,.4);background:var(--bad-soft);color:var(--bad)}
.result-ic svg{width:18px;height:18px}
.result h3{font-size:14px;font-weight:600}
.result p{font-size:10.5px;color:var(--tx-3);line-height:1.7}
.result .result-meta{font:9.5px/1.7 var(--mono);color:var(--tx-4);width:100%;border-top:1px solid var(--line);padding-top:10px}
.result .btn{margin-top:2px}

/* ==========================================================================
   消息总线
   ========================================================================== */
.bus-wrap{max-width:1080px}
.bus-meta{display:flex;align-items:center;gap:16px;padding:9px 13px;border:1px solid var(--line);background:var(--panel);margin-bottom:14px;flex-wrap:wrap}
.bus-meta .bm-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx-3)}
.bus-meta .bm-item .mono{color:var(--tx-2);font-size:10px}
.bus-meta .bm-right{margin-left:auto;font-size:9.5px;color:var(--tx-4);font-family:var(--mono)}
.bus-list{display:flex;flex-direction:column;gap:12px}
.thread{border:1px solid var(--line);background:var(--panel);position:relative}
.thread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--line-2)}
.thread.is-closed::before{background:rgba(62,224,164,.35)}
.thread.is-pending::before{background:var(--wait);box-shadow:0 0 8px rgba(240,180,90,.35)}
.thread.is-blocked::before{background:var(--bad);box-shadow:0 0 8px rgba(255,95,95,.4)}
.thread-head{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.014);flex-wrap:wrap}
.thread-id{font:10px/1.3 var(--mono);color:var(--tx-2);letter-spacing:.04em;display:flex;align-items:center;gap:7px}
.thread-id .hash{color:var(--tx-4)}
.thread-head .spacer{margin-left:auto}
.thread-state{font-size:9px;color:var(--tx-4);font-family:var(--mono);letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.thread-body{display:flex;flex-direction:column}
.bus-entry{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.bus-entry:last-child{border-bottom:0}
.bus-entry.is-sys{background:linear-gradient(90deg,rgba(255,95,95,.045),transparent 70%)}
.be-time{padding-top:1px}
.be-time .mo{font:10px/1.5 var(--mono);color:var(--tx-2);letter-spacing:-.02em;display:block}
.be-time .dd{font:8.5px/1.5 var(--mono);color:var(--tx-4)}
.be-main{min-width:0}
.be-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.be-route{display:flex;align-items:center;gap:6px;font:9.5px/1.3 var(--mono);color:var(--tx-3);letter-spacing:.03em}
.be-route b{color:var(--tx);font-weight:500}
.be-route .arr{color:var(--tx-4)}
.be-body{font-size:11.5px;line-height:1.75;color:var(--tx-2);max-width:82ch}
.be-body .hl{color:var(--tx);font-weight:500}
.be-env{margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:9px/1.4 var(--mono);color:var(--tx-4);border-top:1px dashed rgba(255,255,255,.05);padding-top:7px}
.be-env .kv{display:flex;gap:5px;align-items:center}
.be-env .kv .k{color:var(--tx-4);letter-spacing:.04em}
.be-env .kv .v{color:var(--tx-3)}
.be-env .ok{color:var(--run)}
.terminator{
  display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--line);
  background:rgba(255,255,255,.008);font:8.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);
}
.terminator .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.terminator svg{width:10px;height:10px;flex:none;color:var(--tx-3)}
.terminator .t-state{color:var(--run);opacity:.85;display:flex;align-items:center;gap:5px}
.thread.is-blocked .terminator .t-state{color:var(--bad)}
.sysnote{
  display:flex;gap:9px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);
  background:rgba(240,180,90,.045);font-size:10px;line-height:1.65;color:var(--tx-3);
}
.sysnote svg{width:12px;height:12px;flex:none;margin-top:1px;color:var(--wait)}
.sysnote b{color:var(--tx-2);font-weight:500}
.sysnote .code{font-family:var(--mono);font-size:9.5px;color:var(--tx-2)}
.bus-empty{padding:40px;text-align:center;color:var(--tx-4);font-size:11px;border:1px dashed var(--line)}

/* ==========================================================================
   Modal / Toast
   ========================================================================== */
.modal-host{
  position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(5,7,9,.68);backdrop-filter:blur(2px);padding:20px;
}
.modal-host.is-open{display:flex;animation:fade .16s var(--ease)}
.modal{
  width:min(540px,100%);max-height:calc(100vh - 60px);display:flex;flex-direction:column;
  background:#0e1217;border:1px solid var(--line-hi);
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.02);
  animation:pop .2s var(--ease);position:relative;
}
.modal::before{content:"";position:absolute;left:0;top:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,201,221,.4),transparent)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:13px;font-weight:600}
.modal-head .micro{font-family:var(--mono)}
.modal-close{margin-left:auto;width:24px;height:24px;display:grid;place-items:center;color:var(--tx-3);border:1px solid transparent}
.modal-close:hover{color:var(--tx);border-color:var(--line-2)}
.modal-close svg{width:13px;height:13px}
.modal-body{padding:16px;overflow:auto}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.01)}
.modal-foot .mf-note{font-size:9.5px;color:var(--tx-4);margin-right:auto;display:flex;align-items:center;gap:5px;line-height:1.5}
.modal-foot .mf-note svg{width:11px;height:11px;flex:none}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  border:1px solid var(--line);background:#0b0f14;padding:9px 11px;text-align:left;
  transition:all .16s var(--ease);width:100%;
}
.pick:hover{border-color:var(--line-hi);background:#0f141a}
.pick.is-picked{border-color:rgba(62,224,164,.55);background:linear-gradient(90deg,rgba(62,224,164,.07),rgba(62,224,164,.015))}
.pick-avatar{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-2);font:600 9px/1 var(--mono);color:var(--tx-2)}
.pick.is-picked .pick-avatar{border-color:rgba(62,224,164,.4);color:var(--run)}
.pick-name{display:flex;align-items:center;gap:7px;font:11px/1.3 var(--mono);letter-spacing:.04em;color:var(--tx)}
.pick-role{font-size:9.5px;color:var(--tx-4);margin-top:2px}
.pick-load{font:9px/1.4 var(--mono);color:var(--tx-4);text-align:right;white-space:nowrap}
.pick-load .v{color:var(--tx-3)}
.warn-inline{
  display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;
  border:1px solid rgba(240,180,90,.28);background:var(--wait-soft);font-size:10px;color:#f0c98f;line-height:1.6;
}
.warn-inline svg{width:12px;height:12px;flex:none;margin-top:1px}
.modal-task{border:1px solid var(--line);background:#0b0f14;padding:11px 12px;margin-bottom:14px}
.modal-task .mt-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.modal-task .mt-title{font-size:12px;font-weight:600}
.modal-task .mt-goal{font-size:10.5px;color:var(--tx-3);line-height:1.65}
.modal-task .mt-meta{display:flex;gap:14px;margin-top:7px;font:9px/1.4 var(--mono);color:var(--tx-4);flex-wrap:wrap}

.toasts{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{
  display:flex;align-items:flex-start;gap:9px;min-width:280px;max-width:400px;
  border:1px solid var(--line-hi);background:#11161d;padding:10px 12px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);animation:slideIn .24s var(--ease);
  pointer-events:auto;
}
.toast.out{animation:slideOut .2s var(--ease) forwards}
.toast-ic{width:15px;height:15px;flex:none;margin-top:1px;color:var(--tx-2)}
.toast.success .toast-ic{color:var(--run)}
.toast.warn .toast-ic{color:var(--wait)}
.toast.error .toast-ic{color:var(--bad)}
.toast-txt{font-size:11px;line-height:1.6;color:var(--tx-2)}
.toast-txt b{color:var(--tx);font-weight:500}
.toast-time{font:8.5px/1.4 var(--mono);color:var(--tx-4);margin-left:auto;padding-top:2px}

/* ==========================================================================
   细节补丁：SVG 拓扑 / 滑杆 / 唤醒策略 / 系统提示
   ========================================================================== */
.ic svg{display:block;width:100%;height:100%}
.btn .ic{flex:none}
.g-node{cursor:pointer;outline:none}
.node-disc{transition:stroke-opacity .18s var(--ease),fill .18s}
.g-node:hover .node-disc{stroke-opacity:1;fill:#121b21}
.g-node:hover .node-name{fill:#fff!important}
.g-node:focus-visible .node-disc{stroke-opacity:1;stroke-width:2}
.g-node:focus-visible .node-name{fill:#fff!important}

input[type=range].range{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;margin:10px 0 8px;
  background:#1a2028;border-radius:2px;outline:none;cursor:pointer;
}
input[type=range].range::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--run);
  border:2px solid #0b0f14;box-shadow:0 0 10px rgba(62,224,164,.45);cursor:grab;
}
input[type=range].range::-moz-range-thumb{
  width:11px;height:11px;border-radius:50%;background:var(--run);
  border:2px solid #0b0f14;box-shadow:0 0 10px rgba(62,224,164,.45);cursor:grab;
}
.wake-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.wake{
  padding:9px 10px;border:1px solid var(--line);background:#0b0f14;text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:all .16s var(--ease);min-height:58px;
}
.wake:hover{border-color:var(--line-2);background:#10151c}
.wake-name{font-size:11px;color:var(--tx-2);line-height:1.3}
.wake-desc{font-size:9px;color:var(--tx-4);line-height:1.45}
.wake.is-on{border-color:rgba(62,224,164,.45);background:linear-gradient(160deg,rgba(62,224,164,.08),rgba(62,224,164,.012))}
.wake.is-on .wake-name{color:#9df3d3}
.wake.is-on .wake-desc{color:var(--tx-3)}

.sysnote .sn-ic{display:inline-flex;flex:none}
.sysnote .sn-ic svg{width:12px;height:12px}
.sysnote.bad{background:rgba(255,95,95,.055)}
.sysnote.bad .sn-ic svg{color:var(--bad)}
.sysnote.bad b{color:#ffb3b3}
.input:disabled{opacity:.55;cursor:not-allowed;background:#0a0d11}
.input:disabled:hover{border-color:var(--line-2)}
.doc-scroll::-webkit-scrollbar-thumb{background:#242c35;border-color:#0d1218}
.review-side{gap:12px}

/* 规则框内的原始 SVG 必须限尺寸（否则会撑到 300px+） */
.rule-box .rb-title svg{width:11px;height:11px;flex:none;color:var(--tx-3)}
.toast-ic svg{width:100%;height:100%}

/* Agent 详情 · 职责与边界（结构化列表，密而不挤） */
.charter-panel{position:relative;overflow:hidden}
.charter-body{position:relative}
.charter-mark{
  position:absolute;right:12px;top:4px;width:64px;height:64px;
  color:var(--sig);opacity:.07;pointer-events:none;
}
.charter-mark svg{width:100%;height:100%}
.charter-block{padding:12px 15px;border-bottom:1px solid var(--line);position:relative}
.charter-body > .charter-block:last-child{border-bottom:0}
.charter-k{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-3);font-weight:600;
}
.charter-k .dot{width:5px;height:5px;box-shadow:none}
.charter-list{display:flex;flex-direction:column;gap:3px}
.charter-list li{display:flex;gap:7px;font-size:11px;line-height:1.65;color:var(--tx-2)}
.charter-list li::before{content:"—";color:var(--tx-4);flex:none}
.charter-list.out li{color:var(--tx-3)}
.charter-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.charter-grid .charter-block{border-bottom:0}
.charter-grid .charter-block + .charter-block{border-left:1px solid var(--line)}
.charter-foot{font-size:8.5px;line-height:1.5;color:var(--tx-4);margin-top:8px;letter-spacing:.01em}
.charter-foot .mono{font-size:8.5px;color:var(--tx-3)}
.wl-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px dashed rgba(255,255,255,.04)}
.wl-row:first-of-type{border-top:0}
.wl-row .t{font:10px/1.4 var(--mono);color:var(--tx-2);flex:1;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.wl-row .tag{font-size:8px;padding:1px 4px;line-height:1.5}
.wl-row .dot{width:5px;height:5px;box-shadow:none}
.peer-chips{display:flex;flex-wrap:wrap;gap:5px}
.peer{
  display:inline-flex;align-items:center;gap:5px;padding:2px 6px;
  border:1px solid var(--line-2);background:#0b0f14;
  font:9.5px/1.4 var(--mono);color:var(--tx-2);letter-spacing:.02em;
}
.peer .dot{width:5px;height:5px;box-shadow:none}
.peer-empty{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx-4);line-height:1.6}
.peer-empty .ic{width:11px;height:11px}
.contract-row{
  display:grid;grid-template-columns:36px minmax(0,1fr) 7px;gap:8px;align-items:center;
  padding:5px 0;border-top:1px dashed rgba(255,255,255,.045);
}
.contract-list .contract-row:first-child{border-top:0}
.c-code{
  font:9px/1.45 var(--mono);letter-spacing:.02em;padding:1px 3px;border:1px solid;text-align:center;
}
.c-code.ok{color:#8ff0cc;border-color:rgba(62,224,164,.28);background:rgba(62,224,164,.06)}
.c-code.deny{color:#ff9e9e;border-color:rgba(255,95,95,.28);background:rgba(255,95,95,.06)}
.c-code.wait{color:#f3c47f;border-color:rgba(240,180,90,.28);background:rgba(240,180,90,.06)}
.contract-row .c-txt{font-size:10px;line-height:1.55;color:var(--tx-3)}
.contract-row .c-txt b{color:var(--tx-2);font-weight:500;font:9px/1.4 var(--mono);letter-spacing:.02em;margin-right:6px}
.contract-row .dot{width:5px;height:5px;box-shadow:none}

/* ==========================================================================
   动画
   ========================================================================== */
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(14px)}}
@keyframes cardIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ==========================================================================
   响应式
   ========================================================================== */
@media (max-width:1280px){
  .ov-grid{grid-template-columns:minmax(0,1.4fr) minmax(300px,.85fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step3-grid{grid-template-columns:minmax(0,1fr) minmax(300px,.8fr)}
}
@media (max-width:1080px){
  .ov-grid,.agent-grid,.review-grid,.step3-grid{grid-template-columns:minmax(0,1fr)}
  .review-side{position:static}
  .metrics{grid-template-columns:repeat(3,1fr)}
  .tpl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .identity{grid-template-columns:auto minmax(0,1fr)}
  .id-stats{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);padding-top:12px}
  .stat:first-child{padding-left:0}
}
@media (max-width:900px){
  .rail{width:58px;padding:10px 6px}
  .rail-group,.brand-sub,.nav-item span:not(.nav-count),.rail-create span,.rail-foot{display:none}
  .nav-item{justify-content:center;padding:0;height:36px}
  .nav-count{position:absolute;right:2px;top:2px;font-size:8px;padding:1px 3px}
  .rail-create{justify-content:center;padding:0;height:36px}
  .rail-create svg{width:15px;height:15px}

function icon(name, cls = ''){
  return `<span class="ic ${cls}" aria-hidden="true" style="display:inline-flex;width:13px;height:13px">${ICONS[name] || ''}</span>`;
}

/* HTML 转义（用户输入会进到模板里） */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

const money = n => '¥' + Number(n || 0).toFixed(2);
const pct = (a, b) => Math.min(100, Math.round((a / (b || 1)) * 100));
const agentById = id => AGENTS.find(a => a.id === id);
const taskById = id => TASKS.find(t => t.id === id);
const agentCode = id => (agentById(id) || { code: id || '—' }).code;

function statusMeta(status){
  return STATUS[status] || STATUS.idle;
}

function nowTime(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function nowDate(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* 消息类标签 */
const KINDS = {
  request: { label:'request', zh:'请求', cls:'req' },
  reply:   { label:'reply',   zh:'回复', cls:'rep' },
  system:  { label:'system',  zh:'系统', cls:'sys' },
  blocked: { label:'blocked', zh:'拦截', cls:'bad' }
};

/* 全总线：拍平 + 按时间倒序（最新在前） */
function flatBus(){
  const rows = [];
  BUS.forEach(thread => {
    thread.entries.forEach(e => {
      rows.push({ threadId:thread.id, state:thread.state, ...e,
        kind: e.intercepted ? 'blocked' : e.kind });
    });
    (thread.notes || []).forEach(n => {
      rows.push({ threadId:thread.id, state:thread.state, kind:'system', id:'sys-' + thread.id,
        at:n.at, body:n.text, synthetic:true });
    });
  });
  return rows.sort((a, b) => (b.at > a.at ? 1 : b.at < a.at ? -1 : 0));
}

/* 总览右侧「消息轨迹」 */
function traceRows(limit = 6){
  return flatBus().slice(0, limit);
}

/* Toast */
function toast(msg, type = 'success', hold = 3400){
  const host = document.getElementById('toasts');
  if(!host) return;
  const ic = { success:'checkRing', warn:'alert', error:'alert', info:'activity' }[type] || 'checkRing';
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span class="toast-ic">${ICONS[ic]}</span>
    <span class="toast-txt">${msg}</span>
    <span class="toast-time">${nowTime()}</span>`;
  host.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  }, hold);
}

/* 弹层 */
function openModal(html){
  const host = document.getElementById('modal-host');
  host.innerHTML = html;
  host.classList.add('is-open');
}
function closeModal(){
  const host = document.getElementById('modal-host');
  host.classList.remove('is-open');
  host.innerHTML = '';
}

/* 顶栏时钟 */
function tickClock(){
  const el = document.getElementById('clock');
  if(el) el.textContent = nowTime();
}

/* 把新回复写回总线（保证「总览轨迹 / 总线 / 收件箱」三处一致） */
function appendReplyToBus(targetMsg, replyBody){
  const thread = BUS.find(t => t.entries.some(e => e.id === targetMsg.id));
  if(!thread) return;
  const at = nowTime();
  const entry = {
    id: 'm-' + (++state.idSeq),
    kind: 'reply',
    from: 'scout',
    to: targetMsg.from,
    at,
    date: nowDate(),
    body: replyBody,
    env: { replyTo: targetMsg.id, budget:'¥0.04', attachments:'0' }
  };
  thread.entries.push(entry);
  thread.state = 'closed';
  targetMsg.state = 'closed';
  targetMsg.reply = { at, body: replyBody };
}

/* 追加一条系统级总线记录（验收 / 派发用） */
function appendSystemThread(text, stateName = 'closed'){
  const at = nowTime();
  BUS.unshift({
    id: 'm-' + (++state.idSeq),
    state: stateName,
    entries: [{ id:'m-' + state.idSeq, kind:'system', from:'system', to:'—', at, date:nowDate(),
      body:text, env:{ idem:'—', budget:'¥0.00', attachments:'0' } }]
  });
}

function nodePos(a){ return { x:a.x, y:a.y }; }

/* 消息流动的链路（与总线里的线程一一对应） */
function flowLinks(){
  const links = [];
  // m-1042 请求 + m-1044 回复（已终结）
  links.push({ from:'scout', to:'ledger', color:'var(--sig)', dur:'4.2s', begin:'0s' });
  links.push({ from:'ledger', to:'scout', color:'var(--run)', dur:'4.2s', begin:'-2.1s' });
  // m-1047 请求（等待回复，琥珀色更醒目）
  links.push({ from:'forge', to:'scout', color:'var(--wait)', dur:'3.6s', begin:'-1.2s' });
  // m-1035 请求（已终结）
  links.push({ from:'quill', to:'atlas', color:'var(--sig)', dur:'5s', begin:'-3.2s' });
  return links.map((l, i) => {
    const a = nodePos(agentById(l.from)), b = nodePos(agentById(l.to));
    const mx = (a.x + b.x) / 2 + (i % 2 ? 16 : -16);
    const my = (a.y + b.y) / 2 - 28;
    return { ...l, d:`M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}` };
  });
}

/* 拓扑图：内联 SVG，节点点击可进入 Agent 详情 */

  // 点对点链路（曲线 + 流动光点）

    <path d="${f.d}" fill="none" stroke="${f.color}" stroke-opacity=".55" stroke-width="1"
      stroke-dasharray="1 10" stroke-linecap="round"/>
    <circle r="2.1" fill="${f.color}">
      <animateMotion dur="${f.dur}" begin="${f.begin}" repeatCount="indefinite" rotate="auto">
        <mpath href="#flow-${i}"/>

      <animate attributeName="opacity" values=".2;1;1;.2" dur="${f.dur}" begin="${f.begin}" repeatCount="indefinite"/>

  // 节点
  const nodes = AGENTS.map(a => {
    const st = STATUS[a.status];
    const col = st.cls === 'run' ? 'var(--run)' : st.cls === 'wait' ? 'var(--wait)' : st.cls === 'bad' ? 'var(--bad)' : '#59646f';

        <animate attributeName="stroke-opacity" values=".22;0;.22" dur="3.2s" repeatCount="indefinite"/>

    const tagY = a.y + 41;
    return `<g class="g-node" data-act="open-agent" data-agent="${a.id}" tabindex="0" role="button"

      <title>${a.code} · ${a.role} · ${st.label}</title>
      <circle cx="${a.x}" cy="${a.y}" r="33" fill="transparent"/>
      ${pulse}
      <circle class="node-disc" cx="${a.x}" cy="${a.y}" r="23" fill="#0d1217" stroke="${col}" stroke-opacity=".55" stroke-width="1.1"/>
      <circle cx="${a.x}" cy="${a.y}" r="18" fill="none" stroke="${col}" stroke-opacity=".12" stroke-dasharray="1 3"/>
      <text x="${a.x}" y="${a.y + 3.5}" text-anchor="middle"
        style="font-family:var(--mono);font-weight:500;font-size:9px;fill:#c8d2dc;letter-spacing:.04em">${a.code}</text>
      <text class="node-name" x="${a.x}" y="${tagY}" text-anchor="middle"
        style="font-family:var(--sans);font-weight:500;font-size:10.5px;fill:${a.status === 'blocked' ? '#ff9e9e' : '#b7c1cc'}">${a.code} · ${a.role}</text>
      <text x="${a.x}" y="${tagY + 13}" text-anchor="middle"
        style="font-family:var(--mono);font-size:8.5px;fill:#5f6a77;letter-spacing:.05em">${
          a.status === 'blocked' ? 'BLOCKED · 待授权' : a.status === 'review' ? 'AWAITING REVIEW' : a.status === 'idle' ? 'IDLE' : 'RUNNING'}</text>
      <circle cx="${a.x + 16}" cy="${a.y - 16}" r="3.4" fill="${col}" stroke="#0b0d10" stroke-width="1.4"/>
      ${a.status === 'running' ? `<circle cx="${a.x + 16}" cy="${a.y - 16}" r="6" fill="none" stroke="${col}" stroke-opacity=".3"><animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/></circle>` : ''}
    </g>`;
  }).join('');

  return `<svg class="graph-svg" viewBox="0 0 640 470" role="img" aria-label="集群拓扑：6 个 Agent 围绕指挥台">
    <defs>
      <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3ee0a4" stop-opacity=".13"/>
        <stop offset="60%" stop-color="#3ee0a4" stop-opacity=".03"/>
        <stop offset="100%" stop-color="#3ee0a4" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- 同心参考环 -->
    <circle cx="${hub.x}" cy="${hub.y}" r="150" fill="none" stroke="#1a2129" stroke-width="1"/>
    <circle cx="${hub.x}" cy="${hub.y}" r="104" fill="none" stroke="#161c23" stroke-width="1" stroke-dasharray="2 8"/>

    ${spokes}
    ${flowPaths}

    <!-- 指挥台（用户） -->
    <circle cx="${hub.x}" cy="${hub.y}" r="78" fill="url(#hubGlow)"/>
    <circle cx="${hub.x}" cy="${hub.y}" r="30" fill="#0c1116" stroke="#37424e" stroke-width="1.1"/>

/* 一行消息轨迹 */
function traceRow(r){
  const k = KINDS[r.kind] || KINDS.system;
  const isBlocked = r.kind === 'blocked';
  const isNote = !!r.synthetic || r.from === 'system';
  const dotCls = isBlocked ? 'bad' : k.cls === 'rep' ? 'run' : (r.state === 'pending' && k.cls === 'req') ? 'wait' : 'idle';
  const route = isNote
    ? `<span class="dim">SYSTEM</span> <span class="kind sys">note</span>`
    : isBlocked
      ? `<b>${agentCode(r.from)}</b> <span class="arrow" style="color:var(--tx-4)">→</span> <b>${agentCode(r.to)}</b> <span class="kind sys">拦截</span>`
      : `<b>${agentCode(r.from)}</b> <span style="color:var(--tx-4)">→</span> <b>${agentCode(r.to)}</b> <span class="kind ${k.cls}">${k.label}</span>`;
  return `<div class="trace-row ${isBlocked ? 'is-blocked' : ''}" title="${esc(r.body)}">
    <span class="t-time">${r.at}</span>
    <span class="dot ${dotCls}"></span>
    <div>
      <div class="t-line">${route}</div>
      <div class="t-body">${esc(r.body)}</div>
    </div>
  </div>`;
}

const WAKE = {
  deliver:  { label:'投递即唤醒', desc:'收到消息或任务时唤醒，离线消息排队' },
  manual:   { label:'仅手动唤醒', desc:'不自动消耗 token，需人工点醒' },
  schedule: { label:'定时唤醒',   desc:'每日 09:00 唤醒一次，处理队列' }
};

function wizTemplate(){
  return TEMPLATES.find(t => t.id === state.wizard.template) || null;
}
function wizName(){
  const t = wizTemplate();
  return (state.wizard.name || (t ? t.code : '')).toUpperCase();
}
function wizValid(step){
  const w = state.wizard;
  if(step === 1) return !!(w.template);
  if(step === 2) return /^[A-Za-z][A-Za-z0-9_]{1,11}$/.test(w.name) && w.duty.trim().length >= 10 && w.tools.size > 0;
  return true;
}

const CHARTER = {
  scout: {
    inScope: ['公开资料检索与比对（web.search / http.fetch）', '结论强制附来源、日期与置信度', '差异点给出可复核的抽样证据'],
    outScope: ['不做最终产品决策', '不撰写对外文档（交给 QUILL）', '不向其他 Agent 派活或催进度'],
    peers: ['FORGE', 'LEDGER', 'ATLAS']
  },
  forge: {
    inScope: ['把已确认规格实现为可运行代码', '编写并跑通单元测试', '提交前自检并附运行日志'],
    outScope: ['不改需求、不擅自扩大范围', '不撰写对外文档', '不做发布与上线决策'],
    peers: ['SCOUT']
  },
  quill: {
    inScope: ['把已确认结论写成可发布文档', '按模板统一结构与术语', '标注引用与「待验证」项'],
    outScope: ['不改事实、不改数据', '不代替 ATLAS 做视觉审核', '不对外发布'],
    peers: ['ATLAS', 'SCOUT']
  },
  atlas: {
    inScope: ['按清单评审视觉与可用性', '输出可直接执行的修改项', '区分「必须修改」与「可选建议」'],
    outScope: ['不改源稿、不直接改代码', '不承担技术实现', '不替代人类做验收'],
    peers: ['QUILL', 'SCOUT']
  },
  probe: {
    inScope: ['按规则抓取公开页面', '清洗、去重、结构化', '输出来源日志与失败样本'],
    outScope: ['不解释结论、不评价内容', '不访问登录态或付费墙页面', '不询问他人进度'],
    peers: []
  },
  ledger: {
    inScope: ['核对报表口径与一致性', '抽样复核并输出差异', '给出通过 / 退回结论'],

};

/* 工具风险标记 */
const TOOL_RISK = {
  'web.search': { label:'出网',   cls:'req'  },
  'http.fetch': { label:'出网',   cls:'req'  },
  'file.read':  { label:'只读',   cls:'sys'  },
  'file.write': { label:'写权限', cls:'wait' },
  'shell.exec': { label:'高权限', cls:'bad'  },
  'agent.send': { label:'投递',   cls:'rep'  }
};

/* 通信契约 4 条：右侧用状态灯 + 代码式状态码表达「允许 / 拒绝」 */
const CONTRACT = [
  { code:'200', name:'REQUEST → REPLY', text:'一条 request 最多 1 条 reply，发出即终结', cls:'ok',   dot:'run'  },
  { code:'409', name:'ASK_PROGRESS',    text:'不主动询问进展：协议层不存在该能力',     cls:'deny', dot:'bad'  },
  { code:'202', name:'DELIVER → QUEUE', text:'只投递不阻塞：发送即返回，离线排队',     cls:'ok',   dot:'run'  },
  { code:'403', name:'SELF_VERIFY',     text:'交付物只能由人类验收，Agent 不可自验',   cls:'wait', dot:'wait' }
];

/* 工具 → 图标 */
function toolIcon(id){
  if(id === 'web.search') return 'search';
  if(id === 'http.fetch') return 'globe';
  if(id === 'shell.exec') return 'terminal';
  if(id === 'agent.send') return 'send';
  return 'file';
}

/* 收件箱单条消息 */
function inboxMsgHTML(m, agent){
  const from = m.kind === 'system' ? null : agentById(m.from);
  const open = m.state === 'open';
  const closed = m.state === 'closed';
  const kindTag = m.kind === 'system'
    ? '<span class="tag sys">系统通知</span>'
    : `<span class="tag ${KINDS[m.kind] ? KINDS[m.kind].cls : 'sys'}">${KINDS[m.kind] ? KINDS[m.kind].label : m.kind}</span>`;

  const route = from
    ? `<span class="msg-from">${from.code}</span><span class="arrow">→</span><span class="msg-to">${agent.code}</span>`
    : `<span class="msg-from">SYSTEM</span><span class="arrow">→</span><span class="msg-to">${agent.code}</span>`;

  return `<article class="msg ${open ? 'is-open' : closed ? 'is-closed closed' : ''}" data-msg="${m.id}">
    <div class="msg-head">
      ${route}${kindTag}
      <span class="msg-time">${m.at}</span>
    </div>
    <div class="msg-body">${esc(m.body)}</div>
    ${m.kind === 'system' ? `
      <div class="msg-rule">${icon('shield')} 系统写入 · 无需回复</div>` : `
      <div class="msg-rule">
        ${icon('lock')} 此消息仅可回复一次 · ${closed ? '1/1' : '0/1'} 次回复
        <span style="color:var(--tx-4)">·</span> 截止 ${m.deadline || '—'}
      </div>
      ${open ? `
        <div class="reply-box" data-reply="${m.id}">
          <textarea data-reply-input="${m.id}" maxlength="240" placeholder="回复一次并终结线程。做不到就说明原因，不要反问。"></textarea>
          <div class="reply-foot">
            <span class="rf-hint">${icon('lock')} 发送后线程立即终结，无法补发</span>
            <button class="btn small primary" data-act="send-reply" data-msg="${m.id}">${icon('send')} 发送并终结</button>
          </div>
        </div>`
      : closed && m.reply ? `
        <div class="reply-bubble">
          <div class="rb-head">REPLY · ${m.reply.at} · 线程终结</div>

          ${icon('lock')}
          <span>已回复，通道关闭。该消息不可再次回复；如需追问，应由发起方 ${agentById(m.from) ? agentById(m.from).code : '对方'} 发起新消息。</span>
        </div>` : ''}
    `}
  </article>`;
}

function taskCard(t){
  const a = t.assignee ? agentById(t.assignee) : null;
  const st = a ? STATUS[a.status] : null;
  const isReview = t.status === 'review';
  const isTodo = t.status === 'todo';
  const isRunning = t.status === 'running';
  const isDone = t.status === 'done';
  const flash = state.flashTask === t.id ? 'is-new' : '';
  const overdue = t.due === '10-29 22:00';

  return `<article class="task-card ${flash} ${t.queued ? 'is-queued' : ''}">
    <div class="tc-top">
      <span class="tc-id">${t.id}</span>
      ${t.priority ? `<span class="tag ${t.priority === '高' ? 'wait' : ''}">${t.priority}</span>` : ''}
      ${t.queued ? '<span class="tag bad">排队中</span>' : ''}
      <span class="spacer"></span>
      ${isReview ? '<span class="tag wait"><span class="dot wait"></span>待验收</span>' : ''}
      ${isDone ? `<span class="tag rep">${t.result || '通过'}</span>` : ''}
    </div>
    <div class="tc-title">${esc(t.title)}</div>
    <div class="tc-goal">${esc(t.goal)}</div>
    <div class="tc-meta">
      <div><div class="k">预算</div><div class="v">${isTodo ? money(t.budget.cap) : `${money(t.budget.used)} / ${money(t.budget.cap)}`}</div></div>
      <div><div class="k">截止</div><div class="v ${overdue && !isDone ? 'wait' : ''}">${t.due}</div></div>
      <div><div class="k">验收标准</div><div class="v">${t.criteria} 条</div></div>
      <div><div class="k">交付物</div><div class="v">${t.deliverable || (isDone ? '已归档' : '—')}</div></div>
    </div>
    ${isRunning ? `<div class="tc-progress">
      <div class="bar"><span class="fill" style="width:${t.progress}%"></span></div>
      <div class="lbl"><span>执行中</span><span>${t.progress}%</span></div>
    </div>` : ''}
    ${isReview ? `<div class="tc-progress">
      <div class="bar"><span class="fill" style="width:100%;background:var(--wait)"></span></div>
      <div class="lbl"><span>已提交 · 等待人工确认</span><span>100%</span></div>
    </div>` : ''}
    <div class="tc-actions">
      ${isTodo ? `<button class="btn small primary" data-act="dispatch" data-task="${t.id}">${icon('send')} 派发给 Agent</button>` : ''}
      ${isRunning ? `<button class="btn small" data-act="open-agent" data-agent="${t.assignee}">查看执行</button>` : ''}
      ${isReview ? `<button class="btn small primary" data-act="review-task" data-task="${t.id}">${icon('checkRing')} 去验收</button>` : ''}
      ${isDone ? `<button class="btn small ghost" data-act="review-task" data-task="${t.id}">查看归档</button>` : ''}
      ${a ? `<span class="tc-assignee"><span class="dot ${st.cls}"></span>${a.code}</span>` : '<span class="tc-assignee" style="color:var(--tx-4)">未分配</span>'}
    </div>
    ${t.queued ? `<div class="tc-note">${ICONS.alert}<span>接收方阻塞中，消息与任务已进入离线队列，解阻后按序送达。</span></div>` : ''}
  </article>`;
}

  </div>`;
