/* ---------------------------------------------------------------------------
   9. 视图：消息总线（时间线 · request/reply · 线程终结 · 越界拦截）
   --------------------------------------------------------------------------- */

const BUS_FILTERS = [
  { id:'all',     label:'全部' },
  { id:'request', label:'request' },
  { id:'reply',   label:'reply' },
  { id:'system',  label:'系统 / 拦截' }
];

function threadLastAt(t){
  return t.entries[t.entries.length - 1].at;
}
function threadRoute(t){
  const codes = new Set();
  t.entries.forEach(e => {
    if(e.from && e.from !== 'system') codes.add(agentCode(e.from));
    if(e.to && e.to !== 'system' && e.to !== '—') codes.add(agentCode(e.to));
  });
  return codes.size ? [...codes].join(' ↔ ') : 'SYSTEM';
}
function threadMatches(t, filter){
  if(filter === 'all') return true;
  if(filter === 'reply') return t.entries.some(e => e.kind === 'reply');
  if(filter === 'request') return t.entries.some(e => e.kind === 'request');
  return t.entries.some(e => e.kind === 'system' || e.intercepted) || (t.notes || []).length > 0;
}

function busEntryHTML(e, thread){
  const kind = e.intercepted ? 'blocked' : e.kind;
  const k = KINDS[kind] || KINDS.system;
  const isSys = kind === 'system';
  const route = isSys
    ? `<span class="be-route"><b>SYSTEM</b><span class="arr">→</span><b>${e.to && e.to !== '—' ? agentCode(e.to) : 'ALL'}</b></span>`
    : `<span class="be-route"><b title="${agentCode(e.from)}">${agentCode(e.from)}</b><span class="arr">→</span><b>${agentCode(e.to)}</b></span>`;

  return `<div class="bus-entry ${isSys ? 'is-sys' : ''}">
    <div class="be-time">
      <span class="mo">${e.at}</span>
      <span class="dd">${e.date || ''}</span>
    </div>
    <div class="be-main">
      <div class="be-top">
        <span class="tag ${k.cls}">${k.label}</span>
        ${route}
        <span class="be-route" style="margin-left:auto">
          <span style="color:var(--tx-4)">${e.id}</span>
        </span>
      </div>
      <div class="be-body">${esc(e.body)}</div>
      ${isSys ? '' : `<div class="be-env">
        <span class="kv"><span class="k">idempotency</span><span class="v">${esc(e.env.idem || '—')}</span></span>
        <span class="kv"><span class="k">deadline</span><span class="v">${esc(e.env.deadline || '—')}</span></span>
        <span class="kv"><span class="k">budget</span><span class="v">${esc(e.env.budget || '—')}</span></span>
        <span class="kv"><span class="k">attachments</span><span class="v">${esc(e.env.attachments || '0')}</span></span>
        ${e.env.replyTo ? `<span class="kv"><span class="k">reply_to</span><span class="v">${esc(e.env.replyTo)}</span></span>` : ''}
        <span class="kv"><span class="k">投递</span><span class="v ${e.intercepted ? '' : 'ok'}">${e.intercepted ? '已拦截' : thread.state === 'blocked' ? '已拦截' : '已送达'}</span></span>
      </div>`}
      ${e.intercepted ? `<div class="sysnote bad">
        <span class="sn-ic" style="color:var(--bad)">${ICONS.alert}</span>
        <span>
          <b>系统拦截 · ${esc(e.intercepted.rule)}</b><br>
          ${esc(e.intercepted.reason)}<br>
          <span class="code">处理：${esc(e.intercepted.action)}</span>
        </span>
      </div>` : ''}
    </div>
  </div>`;
}

function busThreadHTML(t){
  const stateLabel = t.state === 'blocked' ? '已拦截' : t.state === 'pending' ? '等待回复' : '已终结';
  const stateCls = t.state === 'blocked' ? 'bad' : t.state === 'pending' ? 'wait' : 'rep';
  const hasRequest = t.entries.some(e => e.kind === 'request');
  const lastAt = threadLastAt(t);

  return `<article class="thread is-${t.state}" data-thread="${t.id}">
    <header class="thread-head">
      <span class="thread-id"><span class="hash">#</span>${t.id}
        <span style="color:var(--tx-4);font-family:var(--sans);letter-spacing:0">${threadRoute(t)}</span>
      </span>
      <span class="spacer"></span>
      <span class="thread-state">最近 ${lastAt}</span>
      <span class="tag ${stateCls}"><span class="dot ${stateCls}"></span>${stateLabel}</span>
    </header>
    <div class="thread-body">
      ${t.entries.map(e => busEntryHTML(e, t)).join('')}
      ${(t.notes || []).map(n => `<div class="sysnote">
        <span class="sn-ic">${ICONS.shield}</span>
        <span><b>系统去重</b> · ${n.at}<br>${esc(n.text)}</span>
      </div>`).join('')}
    </div>
    ${hasRequest ? `<footer class="terminator">
      <span class="t-state">
        ${t.state === 'blocked' ? ICONS.alert : t.state === 'pending' ? ICONS.clock : ICONS.lock}
        ${t.state === 'blocked' ? '未投递 · 已拦截' : t.state === 'pending' ? '线程未终结 · 等待 1 条 reply' : '线程已终结'}
      </span>
      <span>${t.state === 'blocked' ? '越界消息不会进入收件箱' : t.state === 'pending' ? '被投递方最多回复一次' : 'reply 即终结 · 不可追加'}</span>
      <span class="line"></span>
      <span class="mono">${t.id}</span>
    </footer>` : ''}
  </article>`;
}

function viewBus(){
  const sorted = BUS.slice().sort((a, b) => (threadLastAt(b) > threadLastAt(a) ? 1 : -1));
  const filter = state.busFilter || 'all';
  const shown = sorted.filter(t => threadMatches(t, filter));
  const entries = BUS.reduce((n, t) => n + t.entries.length, 0);
  const closed = BUS.filter(t => t.state === 'closed').length;
  const blocked = BUS.filter(t => t.state === 'blocked').length;
  const pending = BUS.filter(t => t.state === 'pending').length;

  return `<div class="view">
    <div class="view-head">
      <div class="vh-left">
        <div class="crumb"><button data-act="go" data-view="overview">集群</button><span>/</span><span>消息总线</span></div>
        <h1 class="vh-title">消息总线 <span class="tag">APPEND-ONLY</span></h1>
        <p class="vh-sub">
          <span>Agent 之间只投递，不对话</span><span class="mono">·</span>
          <span>一问一答，reply 即终结</span><span class="mono">·</span>
          <span>进展不靠询问，靠任务板共享状态</span>
        </p>
      </div>
      <div class="vh-actions">
        <button class="btn ghost" data-act="refresh-board">${icon('refresh')} 刷新日志</button>
        <button class="btn" data-act="go" data-view="agent">${icon('inbox')} 打开收件箱</button>
      </div>
    </div>

    <div class="bus-meta">
      <span class="bm-item">线程 <span class="mono">${BUS.length}</span></span>
      <span class="bm-item">消息 <span class="mono">${entries}</span></span>
      <span class="bm-item"><span class="dot run"></span>已终结 <span class="mono">${closed}</span></span>
      <span class="bm-item"><span class="dot wait"></span>等待回复 <span class="mono">${pending}</span></span>
      <span class="bm-item"><span class="dot bad"></span>拦截 <span class="mono">${blocked}</span></span>
      <span class="bm-right">只追加 · 不可编辑 · 保留 30 天</span>
    </div>

    <div class="bus-wrap">
      <div class="board-tools" style="margin-bottom:12px">
        ${BUS_FILTERS.map(f => {
          const c = f.id === 'all' ? BUS.length : BUS.filter(t => threadMatches(t, f.id)).length;
          return `<button class="filter ${filter === f.id ? 'is-on' : ''}" data-act="bus-filter" data-f="${f.id}">
            ${f.label} <span class="c">${c}</span>
          </button>`;
        }).join('')}
        <div class="bt-right"><span class="tag">按线程分组 · 最新在前</span></div>
      </div>

      <div class="bus-list" id="bus-list">
        ${shown.length ? shown.map(busThreadHTML).join('') : `<div class="bus-empty">该类型下暂无消息</div>`}
      </div>
    </div>
  </div>`;
}

  const map = {
    overview: AGENTS.length,
    bus: BUS.reduce((n, t) => n + t.entries.length, 0),
    agent: AGENTS.length,
    board: TASKS.length,
    review: TASKS.filter(t => t.status === 'review').length
  };
  document.querySelectorAll('.nav-item').forEach(btn => {
    const c = btn.querySelector('.nav-count');
    const v = map[btn.dataset.view];
    if(c && v != null) c.textContent = v;
  });
}

function go(view){
  if(view === 'review'){ openReview(); return; }
  state.view = view;
  render({ scroll: true });
}

/* 打开验收：同一任务时保留已勾选状态 */
function openReview(taskId){
  const id = taskId
    || state.review.taskId
    || (TASKS.find(t => t.status === 'review') || {}).id
    || 'T-203';
  if(state.review.taskId !== id){
    state.review = { taskId: id, checks: {}, reason: '', result: null };
  }
  state.view = 'review';
  render({ scroll: true });
}

function openAgent(id){
  if(!agentById(id)) return;
  state.activeAgent = id;
  state.view = 'agent';
  render({ scroll: true });
}

/* 代号去重：模板代号已被占用时追加序号（SCOUT → SCOUT2） */
function uniqueCode(base){
  const upper = String(base).toUpperCase();
  const taken = c => AGENTS.some(a => a.code.toUpperCase() === c.toUpperCase());
  if(!taken(upper)) return upper;
  let i = 2;
  while(taken(upper + i)) i += 1;
  return upper + i;
}

/* 向导：选择模板时同步默认值 */
function chooseTemplate(id){
  const tpl = TEMPLATES.find(t => t.id === id);
  if(!tpl) return;
  const w = state.wizard;
  w.template = tpl.id;
  w.name = uniqueCode(tpl.code);
  w.duty = tpl.desc;
  w.tools = new Set(tpl.tools);
  w.model = tpl.model;
  w.budget = tpl.budget;
  render();
}

/* 向导底部工具栏的可用性 / 提示 */
function updateWizardFoot(){
  const w = state.wizard;
  const next = document.querySelector('[data-act="wizard-next"]');
  const hint = document.querySelector('.wf-hint');
  if(next) next.disabled = !wizValid(w.step);
  if(hint){
    if(w.step === 1) hint.innerHTML = '选择角色模板以继续';
    else if(w.step === 2) hint.innerHTML = `已授权 <span class="mono">${w.tools.size}</span> 项工具 · 职责 <span class="mono">${w.duty.trim().length}</span> 字`;
    else hint.innerHTML = `将使用 <span class="mono">${(MODELS.find(m => m.id === w.model) || MODELS[0]).label}</span> · 单任务上限 <span class="mono">${money(w.budget)}</span>`;
  }
}

/* 实时刷新第三步右侧卡片 */
function refreshPreview(){
  const el = document.getElementById('agent-preview');
  if(el) el.outerHTML = previewCardHTML();
}

/* 完成创建 */
function finishWizard(){
  const w = state.wizard;
  const tpl = wizTemplate();
  if(!tpl) return toast('请先选择角色模板', 'warn');
  if(!/^[A-Za-z][A-Za-z0-9_]{1,11}$/.test(w.name)) return toast('代号需字母开头、2–12 位（字母/数字/下划线）', 'warn');
  if(w.duty.trim().length < 10) return toast('职责声明至少 10 个字，且包含「不做什么」', 'warn');
  if(w.tools.size === 0) return toast('至少授权 1 项工具，否则 Agent 无法执行任务', 'warn');
  if(AGENTS.some(x => x.code.toUpperCase() === wizName().toUpperCase())){
    return toast(`代号 <b>${esc(wizName())}</b> 已被占用，请换一个（模板默认已做去重）`, 'warn');
  }

  const slot = EXTRA_SLOTS[AGENTS.length - 6] || { x: 320 + (AGENTS.length - 6) * 20, y: 392 };
  const code = wizName();
  const agent = {
    id: 'a' + Date.now(),
    code,
    role: tpl.role,
    status: 'idle',
    x: slot.x, y: slot.y,
    model: w.model,
    duty: w.duty.trim(),
    tools: [...w.tools],
    taskId: null,
    budget: { used: 0, cap: w.budget },
    month: w.month,
    wake: w.wake,
    memory: { entries: 0, last: '—' },
    workspace: '~/agents/' + code.toLowerCase(),
    joined: nowDate(),
    uptime: '刚刚创建',
    lastActive: '—'
  };
  AGENTS.push(agent);
  INBOX[agent.id] = [];
  state.activeAgent = agent.id;

  // 重置向导，回到总览看新节点
  state.wizard = {
    step: 1, template: null, name: '', duty: '', tools: new Set(),
    model: MODELS[0].id, budget: 1.5, month: 6, wake: 'deliver', concurrency: 2
  };
  state.view = 'overview';
  render({ scroll: true });
  toast(`已创建 <b>${code}</b>（${tpl.role}）· 待唤醒，收到第一条任务时启动`);
}

/* 派发确认 */
function confirmDispatch(){
  const { taskId, agentId } = state.dispatch;
  const task = taskById(taskId);
  const agent = agentById(agentId);
  if(!task) return;
  if(!agent){ return toast('请选择接收方 Agent', 'warn'); }

  task.assignee = agent.id;
  task.status = 'running';
  task.progress = 0;
  task.queued = agent.status === 'blocked';
  if(!agent.taskId) agent.taskId = task.id;

  const wasBlocked = agent.status === 'blocked';
  closeModal();
  state.dispatch = { taskId: null, agentId: null };
  state.flashTask = task.id;
  render();
  setTimeout(() => { state.flashTask = null; }, 700);

  if(wasBlocked){
    toast(`<b>${task.id}</b> 已进入 ${agent.code} 的离线队列 · 解阻后送达（不阻塞你）`, 'warn', 4200);
  } else {
    toast(`<b>${task.id}</b> 已派发至 ${agent.code} · 状态 → 进行中 · 派发即唤醒`, 'success');
  }
}

/* 收件箱回复：写入总线、终结线程、更新 UI */
function sendReply(msgId){
  const agent = agentById(state.activeAgent);
  const list = INBOX[agent.id] || [];
  const msg = list.find(m => m.id === msgId);
  if(!msg || msg.state !== 'open') return;

  const box = document.querySelector(`[data-reply-input="${msgId}"]`);
  const text = (box ? box.value : '').trim();
  if(text.length < 2) return toast('回复不能为空：做不到也要给出原因（不低于 2 字）', 'warn');

  appendReplyToBus(msg, text);
  toast(`回复已送达 ${agentCode(msg.from)} · 线程 ${msg.id} 已终结 · 不可再次回复`, 'success');

  // 局部替换该条消息，避免整页重绘
  const node = document.querySelector(`[data-msg="${msgId}"]`);
  if(node) node.outerHTML = inboxMsgHTML(msg, agent);
  const cnt = document.querySelector('[data-inbox-count]');
  if(cnt){
    const open = list.filter(m => m.state === 'open').length;
    cnt.textContent = open;
    const tag = cnt.closest('.tag');
    if(tag){
      tag.classList.toggle('wait', open > 0);
      tag.classList.toggle('sys', open === 0);
      const dot = tag.querySelector('.dot');
      if(dot){ dot.className = 'dot ' + (open ? 'wait' : 'idle'); }
    }
  }
  updateCounters();
}

/* 验收勾选后的局部刷新 */
function updateReviewActions(){
  const { doc } = currentDeliverable();
  if(!doc) return;
  const checked = checkedCount(doc);
  const total = doc.checks.length;
  const fill = document.querySelector('.cp-fill');
  const txt = document.querySelector('[data-cp-txt]');
  if(fill) fill.style.width = (checked / total) * 100 + '%';
  if(txt) txt.textContent = `${checked} / ${total} 已核对`;
  const pass = document.querySelector('[data-act="pass-review"]');
  if(pass) pass.disabled = checked !== total;
  const hint = document.querySelector('[data-ra-hint]');
  if(hint){
    hint.innerHTML = checked === total
      ? `${ICONS.checkRing}<span>已核对全部标准，可以提交验收结论</span>`
      : `${ICONS.lock}<span>需核对全部 ${total} 项后才可通过；驳回不受此限制</span>`;
    hint.classList.toggle('warn', checked !== total);
  }
}

/* 通过验收 */
function passReview(){
  const { task, doc } = currentDeliverable();
  if(!task || !allChecked(doc)) return;
  const at = nowTime();
  task.status = 'done';
  task.progress = 100;
  task.result = '通过 · ' + at.slice(0, 5);
  state.review.result = { type: 'pass', at };
  appendSystemThread(`验收通过：${task.id} · ${task.title} · 交付物 ${doc.file} 已归档（验收人：你）`);
  render({ scroll: true });
  toast(`<b>${task.id}</b> 已通过验收 · 交付物已归档并锁定为只读`, 'success', 4000);
}

/* 驳回 */
function rejectReview(){
  const { task, doc } = currentDeliverable();
  if(!task) return;
  const reason = (state.review.reason || '').trim();
  if(reason.length < 5){
    toast('驳回必须填写原因（不少于 5 字），会直接进入返工单', 'warn');
    const el = document.querySelector('[data-reason]');
    if(el) el.focus();
    return;
  }
  task.status = 'running';
  task.progress = 68;
  task.result = null;
  state.review.result = { type: 'reject', at: nowTime() };
  appendSystemThread(`验收驳回：${task.id} · 原因「${reason}」· 返工单已投递至 ${agentCode(task.assignee)}`);
  render({ scroll: true });
  toast(`<b>${task.id}</b> 已驳回 · 返工单已投递至 ${agentCode(task.assignee)}，任务退回进行中`, 'warn', 4200);
}

/* 新建任务 */
function createTask(){
  const nt = state.newTask || {};
  const title = (nt.title || '').trim();
  const goal = (nt.goal || '').trim();
  if(title.length < 2) return toast('请填写任务名称', 'warn');
  if(goal.length < 5) return toast('请填写目标（说明要什么结果）', 'warn');
  const cap = Math.max(0.1, parseFloat(nt.budget) || 0.8);
  const id = 'T-' + (Math.max(...TASKS.map(t => parseInt(t.id.slice(2), 10))) + 1);
  TASKS.push({
    id, title, goal, status: 'todo', assignee: null, progress: 0,
    budget: { used: 0, cap }, due: '11-03 18:00', criteria: 3, priority: '中'
  });
  state.newTask = {};
  closeModal();
  state.flashTask = id;
  render();
  setTimeout(() => { state.flashTask = null; }, 700);
  toast(`<b>${id}</b> 已创建 · 在「待分配」列派发给 Agent`);
}

/* ---------------------------------------------------------------------------
   11. 交互事件（统一委托，避免重复绑定）
   --------------------------------------------------------------------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    /* 导航 */
    case 'go':            go(el.dataset.view); break;
    case 'open-agent':    openAgent(el.dataset.agent); break;
    case 'review-task':   openReview(el.dataset.task); break;

    /* 创建向导 */
    case 'pick-template': chooseTemplate(el.dataset.tpl); break;
    case 'wizard-step': {
      const target = parseInt(el.dataset.step, 10);
      if(target < state.wizard.step){ state.wizard.step = target; render(); }
      break;
    }
    case 'wizard-next': {
      const w = state.wizard;
      if(!wizValid(w.step)){
        toast(w.step === 1 ? '请先选择一个角色模板' : '请填写代号、职责并授权至少 1 项工具', 'warn');
        break;
      }
      if(w.step < 3){
        // 进入第二步前兜底：模板默认工具必须带上（防止出现「全关」）
        if(w.step === 1 && w.tools.size === 0){
          const tpl = wizTemplate();
          if(tpl){ w.tools = new Set(tpl.tools); w.model = tpl.model; w.budget = tpl.budget; }
        }
        w.step += 1;
        render();
      }
      else finishWizard();
      break;
    }
    case 'wizard-back':
      if(state.wizard.step > 1){ state.wizard.step -= 1; render(); }
      break;
    case 'wizard-draft':  toast('草稿已保存到本地 · 可随时继续', 'info'); break;
    case 'toggle-tool': {
      const id = el.dataset.tool;
      if(state.wizard.tools.has(id)) state.wizard.tools.delete(id);
      else state.wizard.tools.add(id);
      el.classList.toggle('is-on', state.wizard.tools.has(id));
      const pc = document.getElementById('perm-count');
      if(pc) pc.textContent = state.wizard.tools.size;
      refreshPreview();
      updateWizardFoot();
      break;
    }
    case 'set-wake': {
      state.wizard.wake = el.dataset.wake;
      document.querySelectorAll('[data-act="set-wake"]').forEach(b => {
        b.classList.toggle('is-on', b.dataset.wake === state.wizard.wake);
      });
      refreshPreview();
      break;
    }

    /* 看板 / 派发 */
    case 'dispatch':
      state.dispatch = { taskId: el.dataset.task, agentId: null };
      renderDispatchModal();
      break;
    case 'dispatch-first': {
      const t = TASKS.find(x => x.status === 'todo');
      if(!t) return toast('没有待分配任务', 'info');
      state.dispatch = { taskId: t.id, agentId: null };
      renderDispatchModal();
      break;
    }
    case 'pick-agent':
      state.dispatch.agentId = el.dataset.agent;
      renderDispatchModal();
      break;
    case 'confirm-dispatch': confirmDispatch(); break;
    case 'new-task':
      state.newTask = {};
      renderNewTaskModal();
      break;
    case 'confirm-new-task': createTask(); break;
    case 'board-filter':
      state.boardPriority = el.dataset.p;
      render();
      break;
    case 'refresh-board':
      render();
      toast('日志已刷新 · 无新增拦截记录', 'info', 2400);
      break;

    /* 收件箱 */
    case 'send-reply': sendReply(el.dataset.msg); break;

    /* 验收 */
    case 'toggle-check': {
      const cid = el.dataset.check;
      state.review.checks[cid] = !state.review.checks[cid];
      el.classList.toggle('is-checked', !!state.review.checks[cid]);
      updateReviewActions();
      break;
    }
    case 'pass-review': passReview(); break;
    case 'reject-review': rejectReview(); break;

    /* 消息总线 */
    case 'bus-filter': {
      state.busFilter = el.dataset.f;
      render();
      break;
    }

    /* 其他按钮：原型内给出明确反馈，避免死按钮 */
    case 'close-modal': closeModal(); break;
    case 'assign-for-agent':
      toast('已打开任务看板：在「待分配」列选择任务后派发', 'info');
      go('board');
      break;
    case 'request-permission':
      toast('权限审批已提交 · 需你在设置中批准 shell.exec', 'info');
      break;
    case 'download-doc':
      toast('已开始下载交付物 · 原型不产生真实文件', 'info');
      break;
    case 'open-workspace':
      toast('将打开本地工作区 · 原型仅示意', 'info');
      break;
    case 'memory-info':
      toast('记忆查看器将在 Beta 提供 · 原型仅示意', 'info');
      break;
    case 'model-info':
      toast('模型切换需在下一次唤醒时生效', 'info');
      break;
    default:
      break;
  }
});

/* 输入：向导字段、新建任务、驳回原因（不触发整页重绘，保持光标） */
document.addEventListener('input', (e) => {
  const w = state.wizard;
  const field = e.target.dataset.field;

  if(field){
    if(field === 'name') w.name = e.target.value;
    if(field === 'duty'){
      w.duty = e.target.value;
      const cnt = document.getElementById('duty-count');
      if(cnt) cnt.textContent = `${w.duty.trim().length}/120`;
    }
    if(field === 'model') w.model = e.target.value;
    if(field === 'budget'){
      w.budget = parseFloat(e.target.value) || 0.2;
      const v = document.getElementById('budget-val');
      if(v) v.textContent = money(w.budget);
    }
    if(field === 'month'){
      w.month = parseFloat(e.target.value) || 1;
      const v = document.getElementById('month-val');
      if(v) v.textContent = money(w.month);
    }
    refreshPreview();
    updateWizardFoot();
    return;
  }

  if(e.target.dataset.reason !== undefined){
    state.review.reason = e.target.value;
    return;
  }

  const nf = e.target.dataset.new;
  if(nf){
    state.newTask = state.newTask || {};
    state.newTask[nf] = e.target.value;
  }
});

/* 关闭弹层：点击遮罩 / Esc */
document.getElementById('modal-host').addEventListener('click', (e) => {
  if(e.target.id === 'modal-host') closeModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeModal();
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('g-node')){
    e.preventDefault();
    openAgent(e.target.dataset.agent);
  }
  /* 回复框 Cmd/Ctrl + Enter 发送 */
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    const box = e.target.closest('[data-reply]');
    if(box){
      e.preventDefault();
      sendReply(box.dataset.reply);
    }
  }
});

/* 启动 */
render({ scroll: true });
tickClock();
setInterval(tickClock, 1000);
</script>
